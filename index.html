<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      JSON-LD автора и сайта. Стоят статикой, а не в компоненте, по двум причинам:
      схемы Person и WebSite не зависят ни от языка, ни от маршрута, а React 19
      не поднимает инлайновые <script> в <head> — из компонента они отрендерились
      бы в <body>. Схемы BreadcrumbList динамические (собираются через t()) и
      живут в AboutPage/ProjectsPage.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anton Zhilin",
        "jobTitle": "Frontend Developer",
        "url": "https://antoshkindev.ru",
        "email": "ministrov2018@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Moscow",
          "addressCountry": "RU"
        },
        "sameAs": ["https://github.com/ministrov", "https://t.me/antonzhilin83"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AntoshkinDev",
        "url": "https://antoshkindev.ru"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <div id="portal"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
