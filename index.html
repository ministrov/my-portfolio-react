<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      Шрифт первого экрана. Без preload браузер узнаёт о нём только после
      разбора CSS: документ → CSS → шрифт, два лишних круга задержки на
      мобильной сети. Подгружается Golos Text — текст абзацев, тот самый
      элемент, который при подмене шрифта переверстывался и сдвигал /about
      (CLS до 0,18). Unbounded (заголовок героя) не предзагружается: замер
      показал, что лишние 31 КБ вперёд задерживают латинский шрифт и ухудшают
      LCP англоязычных страниц, а сдвига он не вызывает.
    -->
    <link
      rel="preload"
      href="/fonts/GolosText-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      JSON-LD автора и сайта. Стоят статикой, а не в компоненте, по двум причинам:
      схемы Person и WebSite не зависят ни от языка, ни от маршрута, а React 19
      не поднимает инлайновые <script> в <head> — из компонента они отрендерились
      бы в <body>. Схемы BreadcrumbList динамические (собираются через t()) и
      живут в AboutPage/ProjectsPage.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anton Zhilin",
        "jobTitle": "Frontend Developer",
        "url": "https://antoshkindev.ru",
        "email": "ministrov2018@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Moscow",
          "addressCountry": "RU"
        },
        "sameAs": ["https://github.com/ministrov", "https://t.me/antonzhilin83"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AntoshkinDev",
        "url": "https://antoshkindev.ru"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <div id="portal"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
