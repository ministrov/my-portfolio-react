<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap&subset=cyrillic,latin" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #fbfbfd; }
  a { color: #3b5bfd; text-decoration: none; }
  a:hover { color: #7b3ff2; }
  @keyframes hrRise {
    0% { transform: translateY(115%) rotate(2deg); opacity: 0; filter: blur(14px); }
    60% { filter: blur(0px); }
    100% { transform: translateY(0) rotate(0deg); opacity: 1; filter: blur(0px); }
  }
  @keyframes hrFadeUp {
    0% { transform: translateY(18px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes hrTrack {
    0% { letter-spacing: 1.1em; opacity: 0; filter: blur(6px); }
    100% { letter-spacing: 0.42em; opacity: 1; filter: blur(0); }
  }
  @keyframes hrGrid {
    0% { opacity: 0; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes hrPop {
    0% { transform: scale(0.82) translateY(14px); opacity: 0; }
    62% { transform: scale(1.045) translateY(0); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes hrRing {
    0% { transform: scale(0.9); opacity: 0.5; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  @keyframes hrShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
  @keyframes hrGlare {
    0% { transform: translateX(-120%) skewX(-18deg); opacity: 0; }
    12% { opacity: 0.9; }
    88% { opacity: 0.9; }
    100% { transform: translateX(220%) skewX(-18deg); opacity: 0; }
  }
  @keyframes hrBloom {
    0% { transform: scale(0.3); opacity: 0; }
    35% { opacity: 0.85; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  @keyframes hrLive {
    0% { transform: translate(0, 14px) scale(0.4); opacity: 0; }
    22% { opacity: 1; }
    70% { opacity: 0.35; }
    100% { transform: translate(6px, -18px) scale(1); opacity: 0.95; }
  }
  @keyframes hrCaret { 0%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes hrBreath {
    0% { box-shadow: 0 10px 30px rgba(59,91,253,0.28); }
    100% { box-shadow: 0 16px 46px rgba(59,91,253,0.45); }
  }
  @keyframes hrSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes hrOrbit {
    0%, 62%, 100% { transform: translate(0, 0); }
    74% { transform: translate(3px, -3px); }
    86% { transform: translate(0, 0); }
  }
  @keyframes hrAura {
    0% { opacity: 0.22; transform: scale(0.96); }
    100% { opacity: 0.5; transform: scale(1.06); }
  }
  @keyframes hrNudge {
    0%, 70%, 100% { transform: translateY(0); }
    80% { transform: translateY(4px); }
    90% { transform: translateY(0); }
  }
  @keyframes hrHint { 0% { transform: translateY(0); opacity: 0.5; } 100% { transform: translateY(8px); opacity: 1; } }
</style>
</helmet>

<div data-screen-label="Hero" key="{{ key }}" style="{{ rootStyle }}">

  <div style="position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right, rgba(20,24,60,0.055) 1px, transparent 1px), linear-gradient(to bottom, rgba(20,24,60,0.055) 1px, transparent 1px);background-size:148px 148px;mask-image:radial-gradient(115% 85% at 50% 40%, #000 20%, transparent 78%);-webkit-mask-image:radial-gradient(115% 85% at 50% 40%, #000 20%, transparent 78%);animation:hrGrid calc(1.6s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;"></div>

  <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;">
    <sc-for list="{{ particles }}" as="p" hint-placeholder-count="0">
      <span style="{{ p.style }}"></span>
    </sc-for>
  </div>

  <div style="position:absolute;left:50%;top:48%;width:1100px;height:1100px;margin:-550px 0 0 -550px;pointer-events:none;border-radius:50%;background:radial-gradient(circle, rgba(90,110,255,0.18) 0%, rgba(150,90,240,0.09) 38%, rgba(255,255,255,0) 68%);animation:hrBloom calc(2.6s * var(--hrS)) calc(0.85s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;"></div>

  <header style="position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:34px 56px 0;">
    <div style="font:800 25px/1 Montserrat, Helvetica, sans-serif;letter-spacing:-0.02em;color:#151a2e;animation:hrFadeUp calc(0.7s * var(--hrS)) calc(0.15s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;">
      Antoshkin<span style="color:#3b5bfd;">Dev</span><span style="color:#3b5bfd;animation:hrCaret 1.1s steps(1) infinite;">_</span>
    </div>
    <nav style="display:flex;align-items:center;gap:40px;font:600 16px/1 Montserrat, Helvetica, sans-serif;color:#3a4058;animation:hrFadeUp calc(0.7s * var(--hrS)) calc(0.3s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;">
      <a href="#about" style="color:#3a4058;">Обо мне</a>
      <a href="#projects" style="color:#3a4058;">Проекты</a>
    </nav>
    <div style="display:flex;align-items:center;gap:18px;animation:hrFadeUp calc(0.7s * var(--hrS)) calc(0.42s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;">
      <span style="display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 18px;border:1.5px solid rgba(59,91,253,0.35);border-radius:999px;font:600 14px/1 Montserrat, Helvetica, sans-serif;color:#3b5bfd;">Ру</span>
      <a href="#contact" style="display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 26px;border-radius:999px;background:#2f52f7;color:#fff;font:700 15px/1 Montserrat, Helvetica, sans-serif;box-shadow:0 8px 24px rgba(47,82,247,0.3);" style-hover="background:#7b3ff2;box-shadow:0 12px 34px rgba(123,63,242,0.36);">Обсудить проект <span style="font-size:17px;">→</span></a>
    </div>
  </header>

  <main style="position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px 90px;text-align:center;">

    <div style="font:500 15px/1 'JetBrains Mono', ui-monospace, monospace;text-transform:uppercase;color:#9aa0b4;animation:hrTrack calc(1.5s * var(--hrS)) calc(0.5s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;">Динамичная веб-магия на React и Next.js</div>

    <h1 style="position:relative;margin:26px 0 0;font:800 clamp(46px, 6.6vw, 108px)/1.04 Montserrat, Helvetica, sans-serif;letter-spacing:-0.035em;color:#12162a;">
      <span style="display:block;overflow:hidden;padding:0 0.06em;">
        <span style="display:block;animation:hrRise calc(1.15s * var(--hrS)) calc(0.9s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;">Превращаю</span>
      </span>
      <span style="display:block;overflow:hidden;padding:0 0.06em;">
        <span style="display:block;animation:hrRise calc(1.15s * var(--hrS)) calc(1.05s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;">идеи в бесшовные</span>
      </span>
      <span style="display:block;overflow:hidden;padding:0.02em 0.06em 0.12em;">
        <span style="display:block;background:linear-gradient(100deg,#2f52f7 0%,#7b3ff2 28%,#3b5bfd 52%,#7b3ff2 78%,#2f52f7 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hrRise calc(1.15s * var(--hrS)) calc(1.22s * var(--hrS)) cubic-bezier(.16,1,.3,1) both, hrShift 9s linear calc(2.4s * var(--hrS)) infinite;">живые продукты</span>
      </span>
      <span style="{{ glareStyle }}"></span>
    </h1>

    <p style="margin:34px 0 0;font:400 clamp(17px, 1.35vw, 22px)/1.5 Montserrat, Helvetica, sans-serif;color:#5c6379;animation:hrFadeUp calc(0.9s * var(--hrS)) calc(1.85s * var(--hrS)) cubic-bezier(.16,1,.3,1) both;">Привет! Я Антон Жилин, frontend-разработчик из Москвы</p>

    <div style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:56px;margin-top:44px;animation:hrPop calc(0.95s * var(--hrS)) calc(2.05s * var(--hrS)) cubic-bezier(.2,1.5,.35,1) both;">

      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
        <div style="position:relative;padding:2px;border-radius:18px;overflow:hidden;isolation:isolate;box-shadow:0 20px 52px -16px rgba(47,82,247,0.6);">
          <span style="position:absolute;top:-70%;left:-35%;width:170%;height:240%;background:conic-gradient(from 0deg, #2f52f7, #8b3ff2, #ff5c8a, #2f52f7);animation:hrSpin 6s linear infinite;pointer-events:none;"></span>
          <a href="#resume" style="position:relative;display:flex;align-items:center;gap:16px;height:62px;padding:0 32px;border-radius:16px;background:linear-gradient(150deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.6) 100%);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -14px 26px -16px rgba(47,82,247,0.55);color:#1b2140;font:700 16px/1 Montserrat, Helvetica, sans-serif;letter-spacing:0.09em;text-transform:uppercase;transition:transform .4s cubic-bezier(.16,1,.3,1), background .4s ease;" style-hover="transform:translateY(-4px) scale(1.015);background:linear-gradient(150deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.72) 100%);">
            <span style="display:block;">Скачать резюме</span>
            <span style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#2f52f7,#8b3ff2);color:#fff;font-size:15px;box-shadow:0 6px 14px -4px rgba(47,82,247,0.85);animation:hrOrbit 3.6s ease-in-out 3s infinite;">↗</span>
          </a>
        </div>
      </div>
    </div>

    <div style="margin-top:64px;font:500 12px/1 'JetBrains Mono', monospace;letter-spacing:0.3em;text-transform:uppercase;color:#b3b8c8;animation:hrHint 1.6s calc(3.2s * var(--hrS)) ease-in-out infinite alternate;">Скролл ↓</div>
  </main>

  <button type="button" onClick="{{ replay }}" style="position:absolute;right:24px;bottom:22px;z-index:6;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:1px solid rgba(20,24,60,0.12);border-radius:999px;background:rgba(255,255,255,0.72);backdrop-filter:blur(8px);font:600 13px/1 Montserrat, Helvetica, sans-serif;color:#3a4058;cursor:pointer;" style-hover="border-color:rgba(47,82,247,0.5);color:#2f52f7;">↻ Проиграть заново</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;showParticles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;particleCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:54,&quot;min&quot;:0,&quot;max&quot;:140,&quot;step&quot;:2,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;showGlare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  state = { runId: 0 };

  rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  buildParticles(count, speed) {
    const r = this.rng(1337 + count);
    const cols = [
      ['rgba(47,82,247,0.85)', 'rgba(47,82,247,0.45)'],
      ['rgba(123,63,242,0.8)', 'rgba(123,63,242,0.4)'],
      ['rgba(255,92,138,0.8)', 'rgba(255,92,138,0.4)'],
      ['rgba(150,158,190,0.55)', 'rgba(150,158,190,0.25)']
    ];
    const out = [];
    for (let i = 0; i < count; i++) {
      const c = cols[Math.floor(r() * cols.length)];
      const size = 2 + r() * 3.6;
      const dur = (7 + r() * 9) * speed;
      const delay = (0.2 + r() * 2.6) * speed;
      out.push({
        key: i,
        style: {
          position: 'absolute',
          left: (r() * 100).toFixed(2) + '%',
          top: (r() * 100).toFixed(2) + '%',
          width: size.toFixed(1) + 'px',
          height: size.toFixed(1) + 'px',
          borderRadius: '50%',
          background: c[0],
          boxShadow: '0 0 ' + (size * 3).toFixed(0) + 'px ' + c[1],
          opacity: 0,
          animation: 'hrLive ' + dur.toFixed(2) + 's ' + delay.toFixed(2) + 's ease-in-out infinite alternate'
        }
      });
    }
    return out;
  }

  renderVals() {
    const speed = 1 / (this.props.speed ?? 1);
    const count = this.props.showParticles === false ? 0 : (this.props.particleCount ?? 54);
    return {
      key: this.state.runId,
      rootStyle: {
        '--hrS': speed,
        position: 'relative',
        minHeight: '100vh',
        display: 'flex',
        flexDirection: 'column',
        overflow: 'hidden',
        background: 'radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #fafaff 45%, #f4f5fb 100%)',
        fontFamily: 'Montserrat, Helvetica, sans-serif'
      },
      particles: this.buildParticles(count, speed),
      glareStyle: this.props.showGlare === false ? { display: 'none' } : {
        position: 'absolute',
        top: '-6%',
        bottom: '-6%',
        left: 0,
        width: '30%',
        pointerEvents: 'none',
        background: 'linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.92) 45%, rgba(255,255,255,0) 100%)',
        mixBlendMode: 'overlay',
        animation: 'hrGlare ' + (1.5 * speed).toFixed(2) + 's ' + (1.6 * speed).toFixed(2) + 's cubic-bezier(.4,0,.2,1) both'
      },
      replay: () => this.setState(s => ({ runId: s.runId + 1 }))
    };
  }
}
</script>
</body>
</html>
